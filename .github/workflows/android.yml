name: Build Android prototype

on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Fetch pinned inference engine
        run: python3 tools/bootstrap.py

      - name: Restore persistent prototype signing key
        shell: bash
        env:
          ASTRAL_KEY: ${{ secrets.ASTRAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ASTRAL_KEY" ]; then
            echo "Missing signing secret"
            exit 1
          fi
          umask 077
          mkdir -p "$GITHUB_WORKSPACE/.signing"
          printf '%s' "$ASTRAL_KEY" | base64 --decode > "$GITHUB_WORKSPACE/.signing/astral-debug.keystore"
          keytool -exportcert \
            -keystore "$GITHUB_WORKSPACE/.signing/astral-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -file "$GITHUB_WORKSPACE/.signing/astral-debug.der"
          test -s "$GITHUB_WORKSPACE/.signing/astral-debug.keystore"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK uses persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            > apk-signing-certificate.txt
          python3 tools/verify_apk_signer.py \
            .signing/astral-debug.der \
            apk-signing-certificate.txt
          cat apk-signing-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: astral-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-signing-certificate.txt
